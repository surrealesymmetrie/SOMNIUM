<!-- FoglihtenNo07 -->
<style>
@font-face {
    font-family: 'FoglihtenNo07';
    src: url('FoglihtenNo07.ttf') format('truetype');
}

body {
    background-color: #000;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 40px 20px;
    font-family: Arial, sans-serif;
}

h1 {
    font-family: 'FoglihtenNo07', serif;
    font-size: 3rem;
    margin-bottom: 40px;
    letter-spacing: 2px;
}

.pdf-button {
    display: inline-block;
    padding: 10px 20px;
    background-color: rgba(128, 0, 128, 0.7);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-family: 'FoglihtenNo07', serif;
    font-size: 1.1em;
    box-shadow: 0 0 10px rgba(128, 0, 128, 0.4);

    margin-bottom: 30px;

.pdf-button:hover {
    background-color: rgba(128, 0, 128, 0.9);

<body>

<h1>WG-NIGHT-GAME</h1>

<a href="https://drive.google.com/drive/folders/1wCQR5EjvyBOMv0bvJFPsIWT5Nj-iTt2t"
   target="_blank"
   class="pdf-button">
  ➜ Zur PDF // Spielregeln & Karten zum selbst drucken
</a>
<p style="
    text-align:center;
    color:#fff;
    font-family:'FoglihtenNo07', serif;
    font-size:1.4rem;
    margin-top:20px;
">
    Tippe auf den Stapel, um zu mischen und die nächste Karte zu ziehen!
</p>

<div id="card-container" style="text-align:center; margin-top:40px;">
    <img id="card-image" src="Deckblatt.jpg" alt="Kartendeck"
         style="width:300px; height:auto; cursor:pointer;">
</div>

<script>
// --- Kartenliste erzeugen ---
let cards = [];
for (let i = 1; i <= 56; i++) {
    cards.push(i + ".jpg");
}

// --- gemischtes Deck (wird bei jedem Durchlauf neu erstellt) ---
let shuffledDeck = [];
let currentIndex = 0;

// --- Fisher-Yates Shuffle ---
function shuffleCards() {
    shuffledDeck = [...cards];
    for (let i = shuffledDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledDeck[i], shuffledDeck[j]] = [shuffledDeck[j], shuffledDeck[i]];
    }
    currentIndex = 0;
}

// --- Start: Deckblatt anzeigen ---
const cardImage = document.getElementById("card-image");
cardImage.src = "Deckblatt.jpg";

// --- Klick-Event ---
cardImage.addEventListener("click", function() {

    // Wenn wir gerade das Deckblatt sehen → neues Deck mischen
    if (cardImage.src.includes("Deckblatt.jpg")) {
        shuffleCards();
        cardImage.src = shuffledDeck[currentIndex];
        currentIndex++;
        return;
    }

    // Wenn noch Karten übrig sind → nächste Karte zeigen
    if (currentIndex < shuffledDeck.length) {
        cardImage.src = shuffledDeck[currentIndex];
        currentIndex++;
    } else {
        // Alle Karten wurden gezeigt → zurück zum Deckblatt
        cardImage.src = "Deckblatt.jpg";
    }
});
</script>
<div style="text-align:center; margin-top:60px;">

    <p style="
        color:#fff;
        font-family:'Foglihten Regular', serif;
        font-size:1.3rem;

    </p>
